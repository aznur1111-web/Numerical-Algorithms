 "ieee754":{python:`import struct\nimport math\n\n\ndef bits(x):\n    return "".join(f"{b:08b}" for b in struct.pack(">d", x))\n\n\ndef describe(x):\n    b = bits(x)\n    sign = int(b[0], 2)\n    exp = int(b[1:12], 2)\n    frac = int(b[12:], 2) / 2**52\n    bias = 1023\n    print(f"x = {x!r}")\n    print(f"  sign = {sign}")\n    print(f"  biased exponent = {exp}")\n    print(f"  fraction = {frac:.16f}")\n    if 0 < exp < 2047:\n        value = (-1)**sign * (1 + frac) * 2**(exp - bias)\n        print(f"  value = {value!r}")\n\n\ndescribe(0.1)\ndescribe(1.0)\ndescribe(-2.5)\nprint()\nprint("epsilon:", 2**-52)\nprint("0.1 + 0.2 =", 0.1 + 0.2)\n`},
 "cancellation":{python:`import math\n\n# Catastrophic cancellation example\nx = 1e-8\nnaive = (1 - math.cos(x)) / x**2\nstable = 2 * math.sin(x/2)**2 / x**2\nprint(f"naive  = {naive:.16f}")\nprint(f"stable = {stable:.16f}")\nprint(f"difference = {abs(naive - stable):.3e}")\n\n# Another example: quadratic formula\n# x^2 + b x + c = 0 with b >> c\ndef unstable_root(b, c):\n    return (-b + math.sqrt(b*b - 4*c)) / 2\n\ndef stable_root(b, c):\n    return 2*c / (-b - math.sqrt(b*b - 4*c))\n\nb, c = 1e8, 1.0\nprint()\nprint(f"unstable = {unstable_root(b, c):.16f}")\nprint(f"stable   = {stable_root(b, c):.16f}")\n`},
 "error-propagation":{python:`import math\n\n# Condition number of a function\ndef cond(f, fp, x):\n    return abs(x * fp(x) / f(x))\n\nf = lambda x: math.log(x)\nfp = lambda x: 1 / x\nfor x in [1.1, 10, 1e10]:\n    print(f"x = {x}, cond = {cond(f, fp, x):.3f}")\n\n# Forward error vs condition number\ndef forward_error(f, fp, x, eps):\n    return abs(f(x * (1 + eps)) - f(x)) / abs(f(x))\n\nx = 10.0\neps = 1e-10\nprint()\nprint(f"forward error = {forward_error(f, fp, x, eps):.3e}")\nprint(f"bound = kappa * eps = {cond(f, fp, x) * eps:.3e}")\n`},
 "kahan":{python:`def kahan_sum(data):\n    s = 0.0\n    c = 0.0\n    for x in data:\n        y = x - c\n        t = s + y\n        c = (t - s) - y\n        s = t\n    return s\n\n\ndef neumaier_sum(data):\n    s = 0.0\n    c = 0.0\n    for x in data:\n        t = s + x\n        if abs(s) >= abs(x):\n            c += (s - t) + x\n        else:\n            c += (x - t) + s\n        s = t\n    return s + c\n\n\n# Data where naive sum loses precision\ndata = [1e16] + [1.0] * 10 + [-1e16]\nprint("naive    =", sum(data))\nprint("kahan    =", kahan_sum(data))\nprint("neumaier =", neumaier_sum(data))\nprint("expected = 10.0")\n`},
 "pairwise":{python:`def pairwise_sum(a, lo, hi, threshold=8):\n    n = hi - lo\n    if n <= threshold:\n        s = 0.0\n        for i in range(lo, hi):\n            s += a[i]\n        return s\n    mid = (lo + hi) // 2\n    return pairwise_sum(a, lo, mid, threshold) + pairwise_sum(a, mid, hi, threshold)\n\n\ndata = [1e16] + [1.0] * 10 + [-1e16]\nprint("naive     =", sum(data))\nprint("pairwise  =", pairwise_sum(data, 0, len(data)))\nprint("expected  = 10.0")\n`},
 "interval":{python:`# interval arithmetic (basic)\nclass Interval:\n    def __init__(self, lo, hi):\n        if lo > hi:\n            raise ValueError("invalid interval")\n        self.lo = lo\n        self.hi = hi\n    def __add__(self, other):\n        return Interval(self.lo + other.lo, self.hi + other.hi)\n    def __sub__(self, other):\n        return Interval(self.lo - other.hi, self.hi - other.lo)\n    def __mul__(self, other):\n        products = [\n            self.lo * other.lo, self.lo * other.hi,\n            self.hi * other.lo, self.hi * other.hi,\n        ]\n        return Interval(min(products), max(products))\n    def __repr__(self):\n        return f"[{self.lo}, {self.hi}]"\n\n\na = Interval(1.0, 2.0)\nb = Interval(0.5, 1.5)\nprint("a + b =", a + b)\nprint("a - b =", a - b)\nprint("a * b =", a * b)\n`},
 "bisection":{python:`def bisect(f, a, b, tol=1e-10, max_iter=100):\n    fa, fb = f(a), f(b)\n    if fa * fb >= 0:\n        raise ValueError("no sign change")\n    for _ in range(max_iter):\n        c = (a + b) / 2\n        fc = f(c)\n        if abs(fc) < tol or (b - a) / 2 < tol:\n            return c\n        if fa * fc < 0:\n            b, fb = c, fc\n        else:\n            a, fa = c, fc\n    return c\n\n\nprint(bisect(lambda x: x**2 - 2, 1, 2))\nprint(bisect(lambda x: x**3 - 6*x**2 + 11*x - 6, 2.5, 4))\n`},
 "newton":{python:`def newton(f, fp, x0, tol=1e-10, max_iter=50):\n    x = x0\n    for _ in range(max_iter):\n        fx = f(x)\n        fpx = fp(x)\n        if abs(fpx) < 1e-15: break\n        dx = fx / fpx\n        x -= dx\n        if abs(dx) < tol or abs(fx) < tol:\n            return x\n    return x\n\n\nprint(newton(lambda x: x**2 - 2, lambda x: 2*x, 1.0))\nprint(newton(lambda x: x**3 - 6*x**2 + 11*x - 6, lambda x: 3*x**2 - 12*x + 11, 2.5))\n`},
 "secant":{python:`def secant(f, x0, x1, tol=1e-10, max_iter=50):\n    f0, f1 = f(x0), f(x1)\n    for _ in range(max_iter):\n        if abs(f1 - f0) < 1e-15: break\n        x2 = x1 - f1 * (x1 - x0) / (f1 - f0)\n        x0, f0 = x1, f1\n        x1, f1 = x2, f(x2)\n        if abs(x1 - x0) < tol or abs(f1) < tol:\n            return x1\n    return x1\n\n\nprint(secant(lambda x: x**2 - 2, 1.0, 2.0))\n`},
 "brent":{python:`# scipy has a production Brent implementation\ntry:\n    from scipy.optimize import brentq\n    print(brentq(lambda x: x**2 - 2, 1, 2))\n    print(brentq(lambda x: x**3 - 6*x**2 + 11*x - 6, 2.5, 4))\nexcept ImportError:\n    print("Install scipy to run Brent's method from the library.")\n    print("Otherwise see Numerical Recipes in C for a from-scratch implementation.")\n`},
 "fixed-point":{python:`import math\n\n# Iteration x = (x + 2/x) / 2 converges to sqrt(2)\ndef g(x):\n    return (x + 2 / x) / 2\n\nx = 1.0\nfor k in range(20):\n    x = g(x)\n    print(f"iter {k+1}: x = {x:.16f}")\nprint(f"sqrt(2) = {math.sqrt(2):.16f}")\n`},
 "levenberg":{python:`import numpy as np\n\n# Fit y = a * exp(b * x) + c to data using Levenberg-Marquardt\nX = np.array([0.0, 1.0, 2.0, 3.0, 4.0])\ny = np.array([2.0, 2.7, 3.7, 5.0, 6.8])\n\ndef residuals(params):\n    a, b, c = params\n    return a * np.exp(b * X) + c - y\n\ndef jacobian(params):\n    a, b, c = params\n    J = np.zeros((len(X), 3))\n    J[:, 0] = np.exp(b * X)\n    J[:, 1] = a * X * np.exp(b * X)\n    J[:, 2] = 1.0\n    return J\n\nparams = np.array([1.0, 0.5, 1.0])\nlam = 1e-3\nfor it in range(100):\n    r = residuals(params)\n    J = jacobian(params)\n    A = J.T @ J + lam * np.eye(3)\n    g = J.T @ r\n    step = np.linalg.solve(A, -g)\n    new_params = params + step\n    if np.sum(residuals(new_params)**2) < np.sum(r**2):\n        params = new_params\n        lam = max(lam / 3, 1e-10)\n    else:\n        lam *= 2\nprint("fitted:", params)\n`},
 "linear-spline":{python:`# Linear and cubic spline interpolation\nx = [0, 1, 2, 3, 4]\ny = [0, 1, 4, 9, 16]\n\n\ndef linear_interp(xp, xp_points, yp_points):\n    for i in range(len(xp_points) - 1):\n        if xp_points[i] <= xp <= xp_points[i + 1]:\n            t = (xp - xp_points[i]) / (xp_points[i + 1] - xp_points[i])\n            return yp_points[i] + t * (yp_points[i + 1] - yp_points[i])\n    return None\n\n\nprint("linear at 1.5:", linear_interp(1.5, x, y))\nprint("linear at 2.7:", linear_interp(2.7, x, y))\n\n# scipy has a production implementation\ntry:\n    from scipy.interpolate import CubicSpline\n    cs = CubicSpline(x, y)\n    print("spline at 1.5:", cs(1.5))\n    print("spline at 2.7:", cs(2.7))\nexcept ImportError:\n    print("Install scipy for cubic splines.")\n`},
 "chebyshev":{python:`import numpy as np\n\n# Chebyshev nodes on [-1, 1]\ndef cheb_nodes(n):\n    return np.cos(np.pi * (np.arange(n) + 0.5) / n)\n\n# Chebyshev polynomials via recurrence\ndef cheb_T(n, x):\n    if n == 0: return np.ones_like(x)\n    if n == 1: return x\n    T0, T1 = np.ones_like(x), x\n    for k in range(2, n + 1):\n        T0, T1 = T1, 2 * x * T1 - T0\n    return T1\n\nnodes = cheb_nodes(10)\nprint("Chebyshev nodes:", np.round(nodes, 4))\nprint("T_5 at 0.5:", cheb_T(5, 0.5))\nprint("T_10 at -0.3:", cheb_T(10, -0.3))\n`},
 "finite-differences":{python:`import math\n\nf = math.sin\nfp_true = math.cos\nx = 1.0\n\n# Forward difference\nfor h in [1e-4, 1e-6, 1e-8]:\n    fp = (f(x + h) - f(x)) / h\n    print(f"forward h={h:.0e}: {fp:.16f}  err={abs(fp - fp_true(x)):.3e}")\n\n# Central difference\nfor h in [1e-4, 1e-6, 1e-8]:\n    fp = (f(x + h) - f(x - h)) / (2 * h)\n    print(f"central h={h:.0e}: {fp:.16f}  err={abs(fp - fp_true(x)):.3e}")\n\n# Complex step\nfor h in [1e-10, 1e-20]:\n    fp = (f(x + 1j * h)).imag / h\n    print(f"complex h={h:.0e}: {fp:.16f}  err={abs(fp - fp_true(x)):.3e}")\n`},
 "richardson":{python:`import math\n\nf = math.sin\nfp_true = math.cos\nx = 1.0\n\ndef D(h):\n    return (f(x + h) - f(x - h)) / (2 * h)\n\n# Richardson extrapolation\nh = 0.1\nfor k in range(5):\n    D1 = D(h)\n    D2 = D(h / 2)\n    R = (4 * D2 - D1) / 3\n    print(f"h = {h:.4f}: D1 err={abs(D1 - fp_true(x)):.3e}, R err={abs(R - fp_true(x)):.3e}")\n    h /= 2\n`},
 "quadrature":{python:`import math\n\n# Integrate f(x) = sin(x) from 0 to pi\ndef f(x):\n    return math.sin(x)\n\n# Trapezoid rule\ndef trapezoid(a, b, n):\n    h = (b - a) / n\n    s = 0.5 * (f(a) + f(b))\n    for i in range(1, n):\n        s += f(a + i * h)\n    return h * s\n\n# Simpson's rule (n even)\ndef simpson(a, b, n):\n    if n % 2: n += 1\n    h = (b - a) / n\n    s = f(a) + f(b)\n    for i in range(1, n):\n        s += 4 * f(a + i * h) if i % 2 else 2 * f(a + i * h)\n    return h * s / 3\n\nfor n in [10, 100]:\n    t = trapezoid(0, math.pi, n)\n    s = simpson(0, math.pi, n)\n    print(f"n = {n:3d}: trapezoid err = {abs(t - 2):.3e}, simpson err = {abs(s - 2):.3e}")\n`},
 "gauss-quad":{python:`import numpy as np\n\n# Gauss-Legendre nodes and weights for n = 5\nnodes = np.array([\n    -0.9061798459386640,\n    -0.5384693101056831,\n     0.0,\n     0.5384693101056831,\n     0.9061798459386640,\n])\nweights = np.array([\n    0.2369268850561891,\n    0.4786286704993665,\n    0.5688888888888889,\n    0.4786286704993665,\n    0.2369268850561891,\n])\n\ndef integrate_gauss(f, a, b):\n    # map from [-1, 1] to [a, b]\n    mid = 0.5 * (a + b)\n    half = 0.5 * (b - a)\n    return half * sum(w * f(mid + half * x) for x, w in zip(nodes, weights))\n\n# Integrate sin(x) on [0, pi] -> 2\nprint("integral of sin on [0, pi]:", integrate_gauss(np.sin, 0, np.pi))\n# Integrate x^4 on [0, 1] -> 0.2\nprint("integral of x^4 on [0, 1]:", integrate_gauss(lambda x: x**4, 0, 1))\n`},
 "horner":{python:`def horner(coeffs, x):\n    result = coeffs[0]\n    for c in coeffs[1:]:\n        result = result * x + c\n    return result\n\n# p(x) = 1 - 3x + 2x^2\ncoeffs = [2, -3, 1]  # highest first\nfor x in [0, 1, 2]:\n    print(f"p({x}) = {horner(coeffs, x)}")\n\n# derivative via synthetic division\ndef horner_and_derivative(coeffs, x):\n    p = coeffs[0]\n    dp = 0\n    for c in coeffs[1:]:\n        dp = dp * x + p\n        p = p * x + c\n    return p, dp\n\nprint("p(2) and p'(2):", horner_and_derivative(coeffs, 2))\n`},
 "cordic":{python:`import math\n\n# CORDIC rotation to compute sin and cos of an angle\ndef cordic(angle, iters=20):\n    K = 1.0\n    for i in range(iters):\n        K *= math.sqrt(1 + 2**(-2 * i))\n    angles = [math.atan(2**(-i)) for i in range(iters)]\n\n    x, y = 1.0, 0.0\n    theta = 0.0\n    for i in range(iters):\n        s = 1 if angle > theta else -1\n        x, y = x - s * y * 2**(-i), y + s * x * 2**(-i)\n        theta += s * angles[i]\n    return x / K, y / K\n\nfor deg in [0, 30, 45, 60, 90]:\n    c, s = cordic(math.radians(deg))\n    print(f"{deg:>3} deg: cos={c:.6f}, sin={s:.6f}")\n`},
 "lanczos":{python:`import math\n\n# Lanczos approximation of the gamma function (g = 7, n = 9)\nG = 7\nCOEFFS = [\n    0.99999999999980993,\n    676.5203681218851,\n    -1259.1392167224028,\n    771.32342877765313,\n    -176.61502916214059,\n    12.507343278686905,\n    -0.13857109526572012,\n    9.9843695780195716e-6,\n    1.5056327351493116e-7,\n]\n\n\ndef gamma(z):\n    if z < 0.5:\n        return math.pi / (math.sin(math.pi * z) * gamma(1 - z))\n    z -= 1\n    x = COEFFS[0]\n    for i in range(1, G + 2):\n        x += COEFFS[i] / (z + i)\n    t = z + G + 0.5\n    return math.sqrt(2 * math.pi) * t ** (z + 0.5) * math.exp(-t) * x\n\n\nfor z in [0.5, 1.0, 2.5, 5.0, 10.0]:\n    print(f"Gamma({z}) = {gamma(z):.10f}")\nprint("Gamma(0.5) should be sqrt(pi) =", math.sqrt(math.pi))\n`},
 "euler-midpoint":{python:`import math\n\n# dy/dt = -y, y(0) = 1, exact y(t) = exp(-t)\ndef f(t, y):\n    return -y\n\ndef euler(y0, t0, t1, h):\n    n = int(round((t1 - t0) / h))\n    t, y = t0, y0\n    for _ in range(n):\n        y = y + h * f(t, y)\n        t += h\n    return y\n\ndef midpoint(y0, t0, t1, h):\n    n = int(round((t1 - t0) / h))\n    t, y = t0, y0\n    for _ in range(n):\n        k1 = h * f(t, y)\n        k2 = h * f(t + h / 2, y + k1 / 2)\n        y = y + k2\n        t += h\n    return y\n\nfor h in [0.1, 0.01, 0.001]:\n    e = euler(1.0, 0, 1, h)\n    m = midpoint(1.0, 0, 1, h)\n    print(f"h={h}: euler err={abs(e - math.exp(-1)):.3e}, midpoint err={abs(m - math.exp(-1)):.3e}")\n`},
 "rk4":{python:`import math\n\n# dy/dt = -y, y(0) = 1, exact exp(-t)\ndef f(t, y):\n    return -y\n\ndef rk4(y0, t0, t1, h):\n    n = int(round((t1 - t0) / h))\n    t, y = t0, y0\n    for _ in range(n):\n        k1 = h * f(t, y)\n        k2 = h * f(t + h / 2, y + k1 / 2)\n        k3 = h * f(t + h / 2, y + k2 / 2)\n        k4 = h * f(t + h, y + k3)\n        y = y + (k1 + 2 * k2 + 2 * k3 + k4) / 6\n        t += h\n    return y\n\nfor h in [0.1, 0.01, 0.001]:\n    y = rk4(1.0, 0, 1, h)\n    print(f"h={h}: rk4 err={abs(y - math.exp(-1)):.3e}")\n`},
 "symplectic":{python:`import math\n\n# Harmonic oscillator: dq/dt = p, dp/dt = -q\n# Exact solution: q(t) = cos(t), p(t) = -sin(t) starting from q(0)=1, p(0)=0\n\ndef symplectic_euler(q0, p0, h, n):\n    q, p = q0, p0\n    for _ in range(n):\n        p = p - h * q\n        q = q + h * p\n    return q, p\n\ndef leapfrog(q0, p0, h, n):\n    q, p = q0, p0\n    p = p - 0.5 * h * q\n    for _ in range(n):\n        q = q + h * p\n        p = p - h * q\n    p = p + 0.5 * h * q\n    return q, p\n\nt_end = 10.0\nh = 0.1\nn = int(t_end / h)\nexact = (math.cos(t_end), math.sin(-t_end))\nprint("exact:", exact)\nprint("symplectic Euler:", symplectic_euler(1, 0, h, n))\nprint("leapfrog:", leapfrog(1, 0, h, n))\n`},
 "poisson1d":{python:`import numpy as np\n\n# Solve -u'' = f on [0, 1], u(0) = u(1) = 0, f = 1\n# Exact: u(x) = x(1-x)/2\nn = 20\nh = 1.0 / (n + 1)\nA = np.zeros((n, n))\nfor i in range(n):\n    A[i, i] = 2.0\n    if i > 0: A[i, i-1] = -1.0\n    if i < n-1: A[i, i+1] = -1.0\nb = np.ones(n) * h * h\nU = np.linalg.solve(A, b)\n\n# Compare to exact at a few points\nfor i in [0, n//2, n-1]:\n    x = (i + 1) * h\n    exact = x * (1 - x) / 2\n    print(f"i = {i:>2}, x = {x:.3f}, numerical = {U[i]:.6f}, exact = {exact:.6f}")\n`},
 "heat1d":{python:`import numpy as np\n\n# 1D heat equation with Crank-Nicolson\n# u_t = u_xx on [0, 1], u(0, t) = u(1, t) = 0, u(x, 0) = sin(pi x)\n# Exact: u(x, t) = exp(-pi^2 t) sin(pi x)\n\nn = 20\nh = 1.0 / (n + 1)\ndt = 0.001\nT = 0.1\nsteps = int(T / dt)\n\nr = dt / (2 * h * h)\nmain = (1 + 2 * r) * np.ones(n)\noff = -r * np.ones(n - 1)\nA = np.diag(main) + np.diag(off, 1) + np.diag(off, -1)\nB = np.diag(1 - 2 * r) * np.ones((n, n))\nB += np.diag(r * np.ones(n - 1), 1) + np.diag(r * np.ones(n - 1), -1)\n\nx = np.linspace(h, 1 - h, n)\nu = np.sin(np.pi * x)\nfor _ in range(steps):\n    u = np.linalg.solve(A, B @ u)\n\n# Compare with exact\nexact = np.exp(-np.pi**2 * T) * np.sin(np.pi * x)\nprint("max error:", np.max(np.abs(u - exact)))\nprint("u[mid] =", u[n//2], "exact =", exact[n//2])\n`},
 "fft":{python:`import numpy as np\n\n# Naive DFT vs FFT\nx = np.array([1, 2, 3, 4, 5, 6, 7, 8], dtype=complex)\n\n# FFT via numpy\nX = np.fft.fft(x)\nprint("FFT:", np.round(X, 3))\n\n# Inverse\nx_back = np.fft.ifft(X)\nprint("Inverse:", np.round(x_back, 3))\n\n# Naive DFT for comparison\ndef dft(x):\n    N = len(x)\n    n = np.arange(N)\n    k = n.reshape(-1, 1)\n    return np.exp(-2j * np.pi * k * n / N) @ x\n\nprint("DFT:", np.round(dft(x), 3))\nprint("Max diff:", np.max(np.abs(dft(x) - X)))\n`},
 "autodiff-mixed":{python:`import torch\n\n# Reverse-mode autodiff via PyTorch\nx = torch.tensor([2.0, 3.0], requires_grad=True)\ny = (x ** 2).sum() + 5 * x[0] * x[1]\ny.backward()\nprint("gradient:", x.grad)\n# d/dx0 = 2*x0 + 5*x1 = 4 + 15 = 19\n# d/dx1 = 2*x1 + 5*x0 = 6 + 10 = 16\n\n# Mixed precision example\nmodel = torch.nn.Linear(10, 1)\nwith torch.autocast(device_type="cpu", dtype=torch.bfloat16):\n    out = model(torch.randn(4, 10))\nprint("output dtype under autocast:", out.dtype)\n`},
};

/* ============================================================
   Utilities
   ============================================================ */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtNum(x,d=6){
 if(!Number.isFinite(x))return String(x);
 if(Math.abs(x)<1e-15)return '0';
 if(Math.abs(x)>=1e6||Math.abs(x)<1e-4)return x.toExponential(d-1);
 return parseFloat(x.toFixed(d)).toString();
}
function svgWrap(width,height,inner){
 return `<svg class="plot" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
}
function plotFunction(fn,xMin,xMax,yMin,yMax,width=700,height=250,opts){
 opts=opts||{};
 const padL=45,padR=15,padT=15,padB=30;
 const px=x=>padL+(x-xMin)/((xMax-xMin)||1)*(width-padL-padR);
 const py=y=>height-padB-(y-yMin)/((yMax-yMin)||1)*(height-padT-padB);
 let path='';
 const N=400;
 for(let i=0;i<=N;i++){
  const x=xMin+(xMax-xMin)*i/N;
  const y=fn(x);
  if(!Number.isFinite(y))continue;
  path+=(i===0?'M ':' L ')+px(x).toFixed(1)+' '+py(y).toFixed(1);
 }
 let out=`<line x1="${padL}" y1="${height-padB}" x2="${width-padR}" y2="${height-padB}" stroke="var(--line2)"/>`;
 out+=`<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${height-padB}" stroke="var(--line2)"/>`;
 out+=`<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
 if(opts.points){
  for(const p of opts.points){
   out+=`<circle cx="${px(p[0]).toFixed(1)}" cy="${py(p[1]).toFixed(1)}" r="5" fill="${opts.pointColor||'var(--good)'}"/>`;
  }
 }
 if(opts.zero){out+=`<line x1="${padL}" y1="${py(0).toFixed(1)}" x2="${width-padR}" y2="${py(0).toFixed(1)}" stroke="var(--line)" stroke-dasharray="3,3"/>`;}
 out+=`<text x="${padL-6}" y="${py(yMax)+4}" text-anchor="end" font-size="10" fill="var(--subtle)" font-family="monospace">${fmtNum(yMax,2)}</text>`;
 out+=`<text x="${padL-6}" y="${py(yMin)+4}" text-anchor="end" font-size="10" fill="var(--subtle)" font-family="monospace">${fmtNum(yMin,2)}</text>`;
 out+=`<text x="${px(xMin)}" y="${height-padB+14}" text-anchor="middle" font-size="10" fill="var(--subtle)" font-family="monospace">${fmtNum(xMin,2)}</text>`;
 out+=`<text x="${px(xMax)}" y="${height-padB+14}" text-anchor="middle" font-size="10" fill="var(--subtle)" font-family="monospace">${fmtNum(xMax,2)}</text>`;
 return svgWrap(width,height,out);
}
function plotSeries(series,width=700,height=250,opts){
 opts=opts||{};
 const padL=45,padR=15,padT=15,padB=30;
 const allX=series.flatMap(s=>s.x);

  encoded:`1D Poisson: -u'' = 1, u(0)=u(1)=0\nGrid points: ${n}, h = ${fmtNum(h)}\n\nMax error vs exact: ${maxErr.toExponential(3)}\nMidpoint u = ${fmtNum(u[Math.floor(n/2)])}, exact = ${fmtNum(exact[Math.floor(n/2)])}`,
  html:plotSeries([{x:xs,y:exact},{x:xs,y:u}],700,250,{}),
  decoded:`The finite-difference method reduces the ODE to a tridiagonal system. Thomas algorithm solves it in O(n) time.`
 };
}
function demoHeat1d(text){
 const lines=text.split(/\n/).map(l=>l.trim()).filter(Boolean);
 const n=Math.min(Math.max(parseInt(lines[0])||20,5),50);
 const steps=Math.min(Math.max(parseInt(lines[1])||100,10),1000);
 const T=parseFloat(lines[2])||0.5;
 const h=1/(n+1);
 const dt=T/steps;
 const r=dt/(2*h*h);
 // Tridiagonal CN matrices: A = I - r L, B = I + r L
 const A=Array.from({length:n},()=>new Array(n).fill(0));
 const B=Array.from({length:n},()=>new Array(n).fill(0));
 for(let i=0;i<n;i++){
  A[i][i]=1+2*r;
  if(i>0)A[i][i-1]=-r;
  if(i<n-1)A[i][i+1]=-r;
  B[i][i]=1-2*r;
  if(i>0)B[i][i-1]=r;
  if(i<n-1)B[i][i+1]=r;
 }
 // LU factorization of A (Thomas)
 const aa=new Array(n).fill(0);
 const bb=new Array(n).fill(0);
 for(let i=0;i<n;i++){
  aa[i]=i>0?A[i][i-1]:0;
  bb[i]=A[i][i];
  if(i>0){const m=aa[i]/(bb[i-1]);bb[i]-=m*A[i-1][i];aa[i]=m}
 }
 function solveA(b){
  const y=b.slice();
  for(let i=1;i<n;i++)y[i]-=aa[i]*y[i-1];
  const x=new Array(n).fill(0);
  x[n-1]=y[n-1]/bb[n-1];
  for(let i=n-2;i>=0;i--)x[i]=(y[i]-A[i][i+1]*x[i+1])/bb[i];
  return x;
 }
 let u=Array.from({length:n},(_,i)=>Math.sin(Math.PI*(i+1)*h));
 for(let s=0;s<steps;s++){
  const rhs=new Array(n).fill(0);
  for(let i=0;i<n;i++)for(let j=0;j<n;j++)rhs[i]+=B[i][j]*u[j];
  u=solveA(rhs);
 }
 const xs=u.map((_,i)=>(i+1)*h);
 const exact=xs.map(x=>Math.exp(-Math.PI*Math.PI*T)*Math.sin(Math.PI*x));
 const maxErr=Math.max(...u.map((v,i)=>Math.abs(v-exact[i])));
 return{
  encoded:`1D heat equation, Crank-Nicolson\nGrid points: ${n}, steps: ${steps}, T=${T}\n\nMax error vs exact: ${maxErr.toExponential(3)}\nMidpoint u=${fmtNum(u[Math.floor(n/2)])}, exact=${fmtNum(exact[Math.floor(n/2)])}`,
  html:plotSeries([{x:xs,y:exact},{x:xs,y:u}],700,250,{}),
  decoded:`Crank-Nicolson is second-order in time and unconditionally stable. It solves a tridiagonal system at each step.`
 };
}
function demoFft(text){
 const values=parseNums(text);
 if(!values.length||(values.length&(values.length-1))!==0)throw Error('Enter a power-of-two number of values.');
 if(values.length>1024)throw Error('This direct-DFT comparison is limited to 1,024 values to keep the browser responsive.');
 const N=values.length;
 // Naive DFT for comparison
 function dft(x){
  const X=[];
  for(let k=0;k<x.length;k++){
   let re=0,im=0;
   for(let n=0;n<x.length;n++){
    const theta=-2*Math.PI*k*n/x.length;
    re+=x[n]*Math.cos(theta);
    im+=x[n]*Math.sin(theta);
   }
   X.push({re,im});
  }
  return X;
 }
 function fft(x){
  const N=x.length;
  if(N===1)return[{re:x[0],im:0}];
  const even=fft(x.filter((_,i)=>i%2===0));
  const odd=fft(x.filter((_,i)=>i%2===1));
  const X=new Array(N);
  for(let k=0;k<N/2;k++){
   const t={re:Math.cos(-2*Math.PI*k/N)*odd[k].re-Math.sin(-2*Math.PI*k/N)*odd[k].im,
            im:Math.sin(-2*Math.PI*k/N)*odd[k].re+Math.cos(-2*Math.PI*k/N)*odd[k].im};
   X[k]={re:even[k].re+t.re,im:even[k].im+t.im};
   X[k+N/2]={re:even[k].re-t.re,im:even[k].im-t.im};
  }
  return X;
 }
 const X=fft(values);
 const Y=dft(values);
 const mags=X.map(v=>Math.sqrt(v.re*v.re+v.im*v.im));
 const xs=values.map((_,i)=>i);
 return{
  encoded:`Input: [${values.join(', ')}]\n\nFFT magnitudes:\n${mags.map((m,i)=>`  bin ${i}: ${fmtNum(m,6)}`).join('\n')}\n\nMax difference from naive DFT: ${Math.max(...X.map((v,i)=>Math.abs(v.re-Y[i].re)+Math.abs(v.im-Y[i].im))).toExponential(3)}`,
  html:plotSeries([{x:xs,y:values},{x:xs,y:mags}],700,250,{}),
  decoded:`FFT in O(n log n). The plot shows the input (blue) and the magnitude spectrum (orange).`
 };
}
function demoAutodiffMixed(text){
 const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
 const get=(i,d)=>{if(i>=lines.length)return d;const v=Number(lines[i]);if(!Number.isFinite(v))throw Error('Enter finite numeric values.');return v;};
 const x=get(0,2),a=get(1,1),b=get(2,1);
 // f(x, a, b) = a * x^2 + b * x
 const f=x=>a*x*x+b*x;
 const fp=x=>2*a*x+b;
 // dual number autodiff
 function dual(v,dv){return{v,dv}}
 function dadd(x,y){return dual(x.v+y.v,x.dv+y.dv)}
 function dmul(x,y){return dual(x.v*y.v,x.v*y.dv+x.dv*y.v)}
 const X=dual(x,1);
 const A=dual(a,0);
 const B=dual(b,0);
 const term1=dmul(A,dmul(X,X));
 const term2=dmul(B,X);
 const result=dadd(term1,term2);
 return{
  encoded:`f(x) = a x^2 + b x with a=${a}, b=${b}\n\nf(${x}) = ${result.v}\nf'(${x}) = ${result.dv}\n\nAnalytic: ${fp(x)}\nDifference: ${Math.abs(result.dv-fp(x)).toExponential(3)}\n\nForward-mode autodiff propagates the derivative alongside the value.`,
  decoded:`Dual numbers carry (value, derivative). Each operation updates both. Reverse mode (backprop) is more efficient when there are many inputs.`
 };
}

function renderProgressPage(){
 state.page='progress';
 $('#mainView').innerHTML=`<div class="breadcrumb">Numerical Lab / Bookmarks & progress</div><header class="header"><div class="eyebrow">LOCAL ONLY</div><h1>Bookmarks and progress</h1><p>Your progress stays in this browser. Export the JSON to move it or keep a backup.</p></header>
<section class="panel"><div class="panel-head"><h2>Completed lessons</h2></div><div class="body">${state.completed.size?`<div class="references">${[...state.completed].map(id=>`<a href="#${id}" data-open="${id}">${esc(byId[id].title)}</a>`).join('')}</div>`:'<p class="muted">No lessons marked complete yet.</p>'}</div></section>
<section class="panel"><div class="panel-head"><h2>Bookmarks</h2></div><div class="body">${state.bookmarks.size?`<div class="references">${[...state.bookmarks].map(id=>`<a href="#${id}" data-open="${id}">${esc(byId[id].title)}</a>`).join('')}</div>`:'<p class="muted">No bookmarks yet.</p>'}</div></section>
<section class="panel"><div class="panel-head"><h2>Progress data</h2></div><div class="body"><div class="header-actions" style="margin:0"><button class="btn primary" id="exportProgress">Export progress JSON</button><button class="btn" id="clearProgress">Clear completion marks</button></div><p class="muted" style="font-size:12.5px;margin-top:14px">Import accepts only known lesson IDs and a supported schema version.</p></div></section>`;
 $('#mainView').querySelectorAll('[data-open]').forEach(a=>a.onclick=e=>{e.preventDefault();openLesson(a.dataset.open)});
 $('#exportProgress').onclick=exportProgress;
 $('#clearProgress').onclick=()=>{if(confirm('Clear all completion marks?')){state.completed.clear();save();renderProgressPage();renderTree();toast('Completion marks cleared')}};
}

function openLesson(id){if(!byId[id])return;renderLesson(id);renderTree();$('#mainView').focus({preventScroll:true});window.scrollTo(0,0)}
function downloadText(name,text,type='text/plain'){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),800)}
function exportProgress(){downloadText('az-numerical-lab-progress.json',JSON.stringify({schemaVersion:1,completed:[...state.completed],bookmarks:[...state.bookmarks],theme:state.theme,current:state.current,drafts:state.drafts},null,2),'application/json');toast('Progress exported')}
function importProgressFile(file){
 if(file.size>2_000_000){toast('Import rejected: file too large');return}
 const r=new FileReader();
 r.onload=()=>{try{
  const d=JSON.parse(r.result);
  if(!d||d.schemaVersion!==1||!Array.isArray(d.completed)||!Array.isArray(d.bookmarks)||!d.drafts||typeof d.drafts!=='object'||Array.isArray(d.drafts))throw Error('bad schema');
  if([...d.completed,...d.bookmarks].some(id=>typeof id!=='string'||!byId[id]))throw Error('unknown id');
  state.completed=new Set(d.completed);
  state.bookmarks=new Set(d.bookmarks);
  state.theme=['system','light','dark'].includes(d.theme)?d.theme:'system';
  state.current=byId[d.current]?d.current:null;
  state.drafts=Object.fromEntries(Object.entries(d.drafts).filter(([k,v])=>byId[k]&&typeof v==='string'&&v.length<100000));
  applyTheme();save();renderTree();
  state.current?openLesson(state.current):renderHome();
  toast('Progress imported');
 }catch(e){toast('Import rejected: invalid progress data')}};
 r.readAsText(file);
}

function bindGlobal(){
 $('#themeSelect').onchange=()=>{state.theme=$('#themeSelect').value;applyTheme();save()};
 $('#printBtn').onclick=()=>print();
 $('#exportBtn').onclick=exportProgress;
 $('#importBtn').onclick=()=>$('#importFile').click();
 $('#importFile').onchange=e=>{if(e.target.files[0])importProgressFile(e.target.files[0]);e.target.value=''};
 $('#searchInput').oninput=renderTree;
 $('#chapterFilter').onchange=renderTree;
 $('#homeLink').onclick=e=>{e.preventDefault();renderHome();history.replaceState(null,'','#home')};
 $('#courseTree').onclick=e=>{const b=e.target.closest('[data-lesson]');if(b)openLesson(b.dataset.lesson)};
 document.querySelectorAll('[data-page="home"]').forEach(b=>b.onclick=renderHome);
 document.querySelectorAll('[data-page="progress"]').forEach(b=>b.onclick=renderProgressPage);
 document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('#searchInput').focus()}
  if(e.key.toLowerCase()==='t'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){
   state.theme=state.theme==='dark'?'light':state.theme==='light'?'system':'dark';
   applyTheme();save();
  }
 });
}

function init(){
 load();
 applyTheme();
 CHAPTERS.forEach(c=>{const op=document.createElement('option');op.value=c.id;op.textContent=c.title;$('#chapterFilter').append(op)});
 bindGlobal();
 renderTree();
 const hash=location.hash.replace(/^#/,'');
 if(hash&&byId[hash])renderLesson(hash);
 else if(state.current&&byId[state.current])renderLesson(state.current);
 else renderHome();
 progress();
}
init();
</script></body></html>
